<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .card-label      { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .card-sub        { font-size: 12.5px; fill: #334155; }
    .card-label-dark { font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .card-sub-dark   { font-size: 12.5px; fill: #cbd5e1; }
    .section         { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; fill: #64748b; }
    .note            { font-size: 12.5px; fill: #7c2d12; }
    .flow            { stroke-dasharray: 7 5; fill: none; stroke-width: 2.25; }
  </style>

  <rect x="0" y="0" width="1600" height="940" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- INFRASTRUCTURE PROVISIONING                                   -->
  <!-- ============================================================ -->
  <text class="section" x="40" y="34">⚙️ INFRASTRUCTURE PROVISIONING — run locally / via deploy.sh</text>

  <g filter="url(#cardShadow)"><rect x="40" y="44" width="260" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280"/></g>
  <text class="card-label" x="170" y="70" text-anchor="middle">⚙️ Terragrunt / Terraform</text>
  <text class="card-sub" x="170" y="88" text-anchor="middle">terragrunt apply</text>

  <g filter="url(#cardShadow)"><rect x="360" y="44" width="280" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/></g>
  <text class="card-label" x="500" y="70" text-anchor="middle">🗄️ S3 Terraform State</text>
  <text class="card-sub" x="500" y="88" text-anchor="middle">encrypted · S3-native locking, no DynamoDB</text>

  <!-- ============================================================ -->
  <!-- APPLICATION CI/CD                                             -->
  <!-- ============================================================ -->
  <text class="section" x="40" y="150">🚀 APPLICATION CI/CD</text>

  <g filter="url(#cardShadow)"><rect x="40" y="164" width="220" height="64" rx="10" fill="#1e293b" stroke="#0f172a"/></g>
  <text class="card-label-dark" x="150" y="190" text-anchor="middle">👨‍💻 Developer</text>
  <text class="card-sub-dark" x="150" y="208" text-anchor="middle">git push</text>

  <g filter="url(#cardShadow)"><rect x="310" y="164" width="220" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed"/></g>
  <text class="card-label" x="420" y="190" text-anchor="middle">🔗 CodeStar</text>
  <text class="card-sub" x="420" y="208" text-anchor="middle">Connection</text>

  <g filter="url(#cardShadow)"><rect x="580" y="164" width="220" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed"/></g>
  <text class="card-label" x="690" y="190" text-anchor="middle">🔁 CodePipeline</text>
  <text class="card-sub" x="690" y="208" text-anchor="middle">source → build → deploy</text>

  <g filter="url(#cardShadow)"><rect x="850" y="164" width="220" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed"/></g>
  <text class="card-label" x="960" y="190" text-anchor="middle">🔨 CodeBuild</text>
  <text class="card-sub" x="960" y="208" text-anchor="middle">builds Docker image</text>

  <g filter="url(#cardShadow)"><rect x="1120" y="164" width="220" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/></g>
  <text class="card-label" x="1230" y="190" text-anchor="middle">📦 ECR</text>
  <text class="card-sub" x="1230" y="208" text-anchor="middle">image repository</text>

  <!-- notifications row -->
  <g filter="url(#cardShadow)"><rect x="580" y="310" width="220" height="64" rx="10" fill="#e0e7ff" stroke="#4f46e5"/></g>
  <text class="card-label" x="690" y="336" text-anchor="middle">📣 SNS Topic</text>
  <text class="card-sub" x="690" y="354" text-anchor="middle">pipeline events</text>

  <g filter="url(#cardShadow)"><rect x="850" y="310" width="220" height="64" rx="10" fill="#e0e7ff" stroke="#4f46e5"/></g>
  <text class="card-label" x="960" y="336" text-anchor="middle">🤖 AWS Chatbot</text>
  <text class="card-sub" x="960" y="354" text-anchor="middle">Slack integration</text>

  <g filter="url(#cardShadow)"><rect x="1120" y="310" width="220" height="64" rx="10" fill="#1e293b" stroke="#0f172a"/></g>
  <text class="card-label-dark" x="1230" y="336" text-anchor="middle">💬 Slack</text>
  <text class="card-sub-dark" x="1230" y="354" text-anchor="middle">deploy notifications</text>

  <!-- ============================================================ -->
  <!-- VPC                                                           -->
  <!-- ============================================================ -->
  <text class="section" x="260" y="440">VPC — 2 AZs</text>
  <rect x="260" y="450" width="1300" height="440" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g filter="url(#cardShadow)"><rect x="40" y="530" width="200" height="64" rx="10" fill="#1e293b" stroke="#0f172a"/></g>
  <text class="card-label-dark" x="140" y="556" text-anchor="middle">🌐 Internet</text>
  <text class="card-sub-dark" x="140" y="574" text-anchor="middle">Users</text>

  <g filter="url(#cardShadow)"><rect x="300" y="530" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/></g>
  <text class="card-label" x="400" y="556" text-anchor="middle">⚖️ ALB</text>
  <text class="card-sub" x="400" y="574" text-anchor="middle">public subnet · ACM HTTPS</text>

  <g filter="url(#cardShadow)"><rect x="560" y="530" width="260" height="78" rx="10" fill="#ecfdf5" stroke="#059669"/></g>
  <text class="card-label" x="690" y="556" text-anchor="middle">🐳 ECS Fargate</text>
  <text class="card-sub" x="690" y="574" text-anchor="middle">public subnet</text>
  <text class="card-sub" x="690" y="590" text-anchor="middle">CPU + memory autoscaling</text>

  <g filter="url(#cardShadow)"><rect x="880" y="530" width="220" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/></g>
  <text class="card-label" x="990" y="556" text-anchor="middle">🔑 SSM</text>
  <text class="card-sub" x="990" y="574" text-anchor="middle">Parameter Store</text>

  <g filter="url(#cardShadow)"><rect x="560" y="660" width="260" height="64" rx="10" fill="#ecfdf5" stroke="#059669"/></g>
  <text class="card-label" x="690" y="686" text-anchor="middle">🗄️ EC2 Postgres</text>
  <text class="card-sub" x="690" y="704" text-anchor="middle">public subnet · SG: 5432 / 22 only</text>

  <g filter="url(#cardShadow)"><rect x="880" y="660" width="220" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/></g>
  <text class="card-label" x="990" y="686" text-anchor="middle">🪣 S3</text>
  <text class="card-sub" x="990" y="704" text-anchor="middle">application data</text>

  <!-- annotation: unused private subnets -->
  <rect x="300" y="760" width="1160" height="56" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.25" stroke-dasharray="3 3"/>
  <text class="note" x="320" y="784">⚠️ Private subnets are provisioned by the networking module but currently unused —</text>
  <text class="note" x="320" y="802">no NAT gateway or private route table exists yet, so all compute above runs in the public subnets.</text>

  <!-- ============================================================ -->
  <!-- EDGES                                                         -->
  <!-- ============================================================ -->
  <!-- provisioning (slate) -->
  <path id="p1" class="flow" stroke="#64748b" marker-end="url(#arrowSlate)" d="M300,74 L360,74"/>

  <!-- CI/CD (green) -->
  <path id="p2" class="flow" stroke="#059669" marker-end="url(#arrowGreen)" d="M260,196 L310,196"/>
  <path id="p3" class="flow" stroke="#059669" marker-end="url(#arrowGreen)" d="M530,196 L580,196"/>
  <path id="p4" class="flow" stroke="#059669" marker-end="url(#arrowGreen)" d="M800,196 L850,196"/>
  <path id="p5" class="flow" stroke="#059669" marker-end="url(#arrowGreen)" d="M1070,196 L1120,196"/>
  <path id="p6" class="flow" stroke="#059669" marker-end="url(#arrowGreen)" d="M690,228 C690,320 690,420 690,530"/>

  <!-- notifications (indigo) -->
  <path id="p7" class="flow" stroke="#4f46e5" marker-end="url(#arrowIndigo)" d="M690,228 L690,310"/>
  <path id="p8" class="flow" stroke="#4f46e5" marker-end="url(#arrowIndigo)" d="M800,342 L850,342"/>
  <path id="p9" class="flow" stroke="#4f46e5" marker-end="url(#arrowIndigo)" d="M1070,342 L1120,342"/>

  <!-- runtime traffic (blue) -->
  <path id="p10" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)" d="M240,562 L300,562"/>
  <path id="p11" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)" d="M500,562 L560,562"/>
  <path id="p12" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)" d="M690,608 L690,660"/>

  <!-- config/data (amber) -->
  <path id="p13" class="flow" stroke="#d97706" marker-end="url(#arrowAmber)" d="M820,556 L880,556"/>
  <path id="p14" class="flow" stroke="#d97706" marker-end="url(#arrowAmber)" d="M800,592 C840,620 860,650 880,684"/>

  <!-- ============================================================ -->
  <!-- ANIMATED DOTS                                                 -->
  <!-- ============================================================ -->
  <circle r="4.5" fill="#64748b">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M300,74 L360,74"/>
  </circle>

  <circle r="5.5" fill="#059669">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M260,196 L310,196 L530,196 L580,196 L800,196 L850,196 L1070,196 L1120,196"/>
  </circle>
  <circle r="5" fill="#059669">
    <animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M690,228 C690,320 690,420 690,530"/>
  </circle>

  <circle r="4.5" fill="#4f46e5">
    <animateMotion dur="3.5s" repeatCount="indefinite"
      path="M690,228 L690,310 L690,342 L800,342 L850,342 L1070,342 L1120,342"/>
  </circle>

  <circle r="5.5" fill="#2563eb">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M240,562 L300,562 L500,562 L560,562"/>
  </circle>
  <circle r="4.5" fill="#2563eb">
    <animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite" path="M690,608 L690,660"/>
  </circle>
  <circle r="4.5" fill="#d97706">
    <animateMotion dur="1.8s" begin="0.5s" repeatCount="indefinite" path="M820,556 L880,556"/>
  </circle>
  <circle r="4.5" fill="#d97706">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" path="M800,592 C840,620 860,650 880,684"/>
  </circle>

  <!-- dash flow -->
  <animate href="#p1" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p2" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p3" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p4" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p5" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p6" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p7" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p8" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p9" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p10" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p11" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p12" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p13" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  <animate href="#p14" attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>

  <!-- ============================================================ -->
  <!-- LEGEND                                                        -->
  <!-- ============================================================ -->
  <circle cx="40" cy="908" r="6" fill="#64748b"/>
  <text class="card-sub" x="55" y="913">Provisioning (terragrunt apply)</text>
  <circle cx="340" cy="908" r="6" fill="#059669"/>
  <text class="card-sub" x="355" y="913">App CI/CD deploy flow</text>
  <circle cx="600" cy="908" r="6" fill="#4f46e5"/>
  <text class="card-sub" x="615" y="913">Pipeline notifications</text>
  <circle cx="860" cy="908" r="6" fill="#2563eb"/>
  <text class="card-sub" x="875" y="913">Live user traffic</text>
  <circle cx="1080" cy="908" r="6" fill="#d97706"/>
  <text class="card-sub" x="1095" y="913">Config / data reads</text>
</svg>
